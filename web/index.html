/* Layout: slim rail + content on desktop, bottom tab bar on phones. Compact density, color-blocked cards, 1.5px ink outlines with a small hard shadow. */
:root{
  --bg:#EFEBFB; --card:#FFFFFF; --ink:#18142E; --mut:#6C6688; --line:#18142E; --soft:#F6F3FF;
  --pink:#FF6B94; --lime:#CDF55A; --sky:#8DB7FF; --sun:#FFD955; --vio:#8266FF; --on:#18142E;
  --bad:#E5384F; --ok:#1E9E62; --shadow:#18142E;
  --f-d:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-b:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-m:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0C1D; --card:#1A1632; --ink:#F2EFFF; --mut:#A59FC6; --line:#4A4378; --soft:#221D40; --shadow:#000; --bad:#FF6B7D; --ok:#4BD58F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0C1D; --card:#1A1632; --ink:#F2EFFF; --mut:#A59FC6; --line:#4A4378; --soft:#221D40; --shadow:#000; --bad:#FF6B7D; --ok:#4BD58F; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 13.5px/1.45 var(--f-b);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--vio);outline-offset:2px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100%}
/* rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:18px 12px;display:flex;flex-direction:column;gap:4px;border-right:1.5px solid var(--line)}
.logo{font:800 20px/1 var(--f-d);letter-spacing:-.02em;padding:4px 8px 14px}
.logo i{font-style:normal;color:var(--pink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--mut);font-weight:600;border:1.5px solid transparent}
.nav a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{color:var(--ink);background:var(--soft)}
.nav a[aria-current=page]{background:var(--lime);color:var(--on);border-color:var(--line);box-shadow:2px 2px 0 var(--shadow)}
.rail .sp{flex:1}
.sync{font:500 11px var(--f-m);color:var(--mut);padding:6px 8px;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--ok)} .dot.busy{background:var(--sun)}
/* main */
main{min-width:0;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px 22px;max-width:1180px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font:800 clamp(30px,5vw,46px)/1 var(--f-d);letter-spacing:-.03em;margin:0;text-wrap:balance}
h1 em{font-style:normal;background:var(--lime);color:var(--on);padding:0 .14em;border-radius:8px}
.sub{color:var(--mut);margin:6px 0 0;max-width:60ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* controls */
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-weight:700;display:inline-flex;gap:6px;align-items:center;box-shadow:2px 2px 0 var(--shadow);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}
.btn.pri{background:var(--pink);color:var(--on)} .btn.lime{background:var(--lime);color:var(--on)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.ico{width:34px;height:34px;padding:0;justify-content:center}
.ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-weight:700;font-size:12px}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.search{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;min-width:0;width:200px}
.fld{width:100%;min-width:0;border:1.5px solid transparent;background:transparent;border-radius:8px;padding:5px 7px;color:var(--ink)}
.fld:hover{background:var(--soft)} .fld:focus{background:var(--card);border-color:var(--vio);outline:none}
select.fld{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 8px) 55%;background-size:4px 4px;background-repeat:no-repeat;padding-right:20px}
input.num{text-align:right;font-family:var(--f-m)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;box-shadow:3px 3px 0 var(--shadow);min-width:0}
.card h3{font:800 15px var(--f-d);margin:0 0 8px;letter-spacing:-.01em;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tint-pink{background:var(--pink);color:var(--on)} .tint-lime{background:var(--lime);color:var(--on)} .tint-sky{background:var(--sky);color:var(--on)} .tint-sun{background:var(--sun);color:var(--on)} .tint-vio{background:var(--vio);color:#fff}
.mono{font-family:var(--f-m)} .mut{color:var(--mut)}
.chip{display:inline-flex;align-items:center;font:600 11px var(--f-m);border:1.5px solid var(--line);border-radius:999px;padding:0 8px;height:20px;white-space:nowrap}
.chip.bad{background:var(--bad);color:#fff;border-color:var(--bad)} .chip.ok{background:var(--lime);color:var(--on)} .chip.warn{background:var(--sun);color:var(--on)}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;margin-bottom:14px}
.names{padding:18px;overflow:hidden;position:relative}
.names .big{font:800 clamp(38px,8vw,92px)/.92 var(--f-d);letter-spacing:-.045em;overflow-wrap:anywhere}
.names .big b{color:var(--pink);font-weight:800}
.names p{margin:10px 0 0;font-weight:600}
.stamp{position:absolute;right:12px;top:12px;transform:rotate(6deg);background:var(--sun);color:var(--on);border:1.5px solid var(--line);border-radius:8px;padding:2px 9px;font:700 11px var(--f-m)}
.count{padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.count .n{font:800 clamp(64px,10vw,96px)/.85 var(--f-d);letter-spacing:-.06em}
.count .l{font-weight:700}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat{display:block;text-decoration:none;color:var(--on);padding:13px;border:1.5px solid var(--line);border-radius:16px;box-shadow:3px 3px 0 var(--shadow);transition:transform .1s}
.stat:hover{transform:translate(-1px,-1px)}
.stat .k{font:700 11px var(--f-m);text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.stat .v{font:800 30px/1.05 var(--f-d);letter-spacing:-.03em;margin-top:2px}
.stat .s{font-size:12px;font-weight:600;margin-top:2px}
.bar{height:9px;border-radius:99px;background:rgba(24,20,46,.18);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--on);border-radius:99px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mq{overflow:hidden;border:1.5px solid var(--line);border-radius:99px;background:var(--ink);color:var(--bg);margin:0 0 14px;white-space:nowrap}
.mq div{display:inline-block;padding:5px 0;font:700 12px var(--f-m);letter-spacing:.08em;animation:mq 38s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.mq div{animation:none}.btn,.stat{transition:none}}
.li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);min-width:0}
.li:first-of-type{border-top:0}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.empty{padding:22px;text-align:center;color:var(--mut)}
/* data rows */
.rows{display:flex;flex-direction:column;gap:0;border:1.5px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.row{display:grid;gap:4px;align-items:center;padding:3px 6px;border-top:1px solid color-mix(in srgb,var(--line) 35%,transparent)}
.row:first-child{border-top:0}
.row.head{font:700 10.5px var(--f-m);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);background:var(--soft);padding:7px 6px}
.row .x{opacity:.35;border:0;background:none;border-radius:8px;width:28px;height:28px}
.row:hover .x,.row .x:focus-visible{opacity:1}
.row .x:hover{background:var(--bad);color:#fff}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sum .s{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;min-width:92px}
.sum .s b{display:block;font:800 20px/1.1 var(--f-d)} .sum .s span{font:600 10.5px var(--f-m);color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.bar2{height:10px;border-radius:99px;background:var(--soft);border:1.5px solid var(--line);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--vio)}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 6px}
.sechead h2{font:800 16px var(--f-d);margin:0;letter-spacing:-.01em}
.stbtn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);flex:none;padding:0;display:grid;place-items:center;font-size:12px;font-weight:800;line-height:1}
.stbtn[data-s="1"]{background:var(--sun);color:var(--on)} .stbtn[data-s="2"]{background:var(--lime);color:var(--on)}
.done .fld.tt{text-decoration:line-through;color:var(--mut)}
.rt{font:700 15px var(--f-m);white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs .pill{padding:5px 13px;font-size:12.5px}
.tbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tcard{padding:10px}
.tcard .hd{display:flex;justify-content:space-between;font:800 14px var(--f-d);margin-bottom:4px}
.tcard .g{font-size:12px;display:flex;justify-content:space-between;gap:6px;border-top:1px dashed var(--line);padding:2px 0}
.sec2{margin-top:14px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.form label{display:block;font:600 10.5px var(--f-m);text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.form .fld{border-color:var(--line);background:var(--card);margin-top:3px;font:500 13.5px var(--f-b);color:var(--ink);text-transform:none;letter-spacing:0}
/* toast + modal */
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:700;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90vw}
.ov{position:fixed;inset:0;background:rgba(10,8,25,.55);z-index:40;display:grid;place-items:center;padding:16px}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto}
.modal textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:10px;background:var(--soft);padding:8px;font:12px var(--f-m)}
/* responsive */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;z-index:30;flex-direction:row;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1.5px solid var(--line);background:var(--card);align-items:center}
  .logo,.rail .sp,.sync{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;width:100%;scrollbar-width:none}
  .nav a{flex-direction:column;gap:2px;font-size:10.5px;padding:5px 9px;min-width:58px;text-align:center;border-radius:12px;box-shadow:none!important}
  main{padding:14px 16px calc(90px + env(safe-area-inset-bottom,0px))}
  .hero{grid-template-columns:minmax(0,1fr)} .count{flex-direction:row;align-items:center}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
  .search{width:100%;flex:1}
  .row:not(.head){grid-template-columns:repeat(2,minmax(0,1fr))!important;padding:8px;gap:4px 8px}
  .row.head{display:none}
  .row .c::before{content:attr(data-l);display:block;font:600 9.5px var(--f-m);text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding-left:7px}
  .row .c.w2{grid-column:span 2}
  .row .x{position:absolute;right:6px;top:6px}
  .row{position:relative}
  .row .c:first-child{padding-right:30px}
}
</style>

let dbc=null,cloud='local',dirty=new Set(),flight={},timer=null,firstSnap=true;

async function flush(){

}
async function initCloud(){

V.tasks={render(){
  return head('<em>Tasks</em>','Ideal timeline from your master checklist. Due dates follow the wedding date. Tap the circle to cycle to do, doing and done.',`<input class="search" id="q" placeholder="Search tasks" value="${esc(ui.q)}">${pills(['Open','Overdue','Done','All'],ui.tf,'tf')}`)+`<div id="sum"></div><div id="list"></div>`},
  sum(){const s=stats();$('#sum').innerHTML=`<div class="sum"><div class="s"><b>${s.done}/${s.total}</b><span>done</span></div><div class="s"><b style="color:${s.od?'var(--bad)':'inherit'}">${s.od}</b><span>overdue</span></div><div class="s" style="flex:1;min-width:160px"><b>${s.total?Math.round(s.done/s.total*100):0}%</b><div class="bar2" style="margin-top:4px"><i style="width:${s.total?s.done/s.total*100:0}%"></i></div></div></div>`},
  list(){
    this.sum();

      const rows=all.filter(x=>matches(x,ui.q)&&(ui.tf==='All'||(ui.tf==='Open'&&x.st!==2)||(ui.tf==='Done'&&x.st===2)||(ui.tf==='Overdue'&&x.st!==2&&(dueDate(x.when)||9e15)<today())));

  list(){this.sum();$('#list').innerHTML=ui.stay==='Hotel'?grid('hotel',HCOLS,S.hotel):ui.stay==='Transport'?grid('trans',TCOLS,S.trans):grid('meals',MCOLS,S.meals)},upd(){this.sum()}};

const CCOLS=[{f:'phase',l:'Phase',w:'1fr'},{f:'desk',l:'Job desk',w:'1.4fr'},{f:'name',l:'Crew',w:'1.2fr',p:'Assign someone'},{f:'phone',l:'Phone',t:'tel',w:'1fr'}];
V.crew={render(){const ph=['All',...new Set(S.crew.map(c=>c.phase))];return head('<em>Crew</em>','Job desks by phase. Assign a name to each.',`<input class="search" id="q" placeholder="Search crew" value="${esc(ui.q)}"><button class="btn lime" data-act="add" data-m="crew">+ Add</button>`)+`<div class="tabs">${ph.map(p=>`<button class="pill" data-act="flt" data-n="crew" data-v="${esc(p)}" aria-pressed="${ui.crew===p}">${esc(p)}</button>`).join('')}</div><div id="sum"></div><div id="list"></div>`},
  sum(){const a=S.crew.filter(c=>c.name).length;$('#sum').innerHTML=`<div class="sum"><div class="s"><b>${a}/${S.crew.length}</b><span>desks staffed</span></div></div>`},
  list(){this.sum();$('#list').innerHTML=grid('crew',CCOLS,S.crew.filter(r=>(ui.crew==='All'||r.phase===ui.crew)&&matches(r,ui.q)))},upd(){this.sum()}};

V.packing={render(){return head('<em>Packing</em>','Item checklists for the couple. Tick things off as they go into the bag.',`<button class="btn lime" data-act="addpack">+ Item</button>`)+`<div class="tabs">${['Groom','Bride'].map(w=>`<button class="pill" data-act="flt" data-n="packWho" data-v="${w}" aria-pressed="${ui.packWho===w}">${w}</button>`).join('')}</div><div id="list"></div>`},
  list(){
    const items=S.packing.filter(p=>p.who===ui.packWho);const phs=[...new Set(items.map(p=>p.phase))];
    $('#list').innerHTML=`<div class="tbl" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">`+phs.map(ph=>{const l=items.filter(p=>p.phase===ph),d=l.filter(p=>p.done).length;
      return `<div class="card tcard"><div class="hd"><span>${esc(ph)}</span><span class="chip ${d===l.length?'ok':''}">${d}/${l.length}</span></div><div class="bar2" style="margin-bottom:6px"><i style="width:${l.length?d/l.length*100:0}%"></i></div>`+
      l.map(p=>`<label class="li" style="cursor:pointer"><input type="checkbox" data-m="packing" data-id="${p.id}" data-f="done" ${p.done?'checked':''} style="accent-color:var(--vio);width:16px;height:16px"><span class="t ${p.done?'mut':''}" style="${p.done?'text-decoration:line-through':''}">${esc(p.t)}</span></label>`).join('')+`</div>`}).join('')+`</div>`}};

/* ---------- router / render ---------- */
let cur='home';
function route(){const h=(location.hash||'#home').slice(1);cur=V[h]?h:'home'}
function render(){
  route();
  $('#nav').innerHTML=VIEWS.map(([k,l,i])=>`<a href="#${k}" ${k===cur?'aria-current="page"':''}>${ico(i)}<span>${l}</span></a>`).join('');
  const v=V[cur];$('#main').innerHTML=v.render()+(cur==='home'||cur==='event'?'':'');
  if(v.list)v.list();else if(v.sum)v.sum();
  $('#main').insertAdjacentHTML('beforeend',`<div style="margin-top:26px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn sm" data-act="backup">Backup &amp; restore</button><button class="btn sm ghost" data-act="theme">Switch theme</button><span id="cloudbadge" class="mono mut" style="font-size:11px;display:flex;gap:6px;align-items:center"></span></div>`);
  setSync();
}
window.addEventListener('hashchange',()=>{ui.q='';render();window.scrollTo(0,0)});

/* ---------- events ---------- */
const main=$('#main');
function setPath(o,p,v){const ks=p.split('.');const l=ks.pop();ks.forEach(k=>o=o[k]);o[l]=v}
document.addEventListener('change',e=>{
  const t=e.target;if(t.id==='rstart'){S.rundown[ui.ev].start=t.value;save('rundown');V.rundown.list();return}
  if(t.id==='cap'){ls.set('vowly.cap',t.value);V.guests.seating();return}
  const m=t.dataset&&t.dataset.m;if(!m)return;
  let val=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?'':parseFloat(t.value)):t.value;
  if(m==='info'){setPath(S.info,t.dataset.p,val);if(t.dataset.p!=='cur'||1)S.info.sample=false;save('info');return}
  const arr=m==='rd'?S.rundown[ui.ev].rows:S[m];const r=arr.find(x=>x.id===t.dataset.id);if(!r)return;
  r[t.dataset.f]=val;save(m==='rd'?'rundown':m);
  if(m==='packing')V.packing.list();else if(V[cur].upd)V[cur].upd();
  if(m==='check')V.tasks.sum();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;V[cur].list&&V[cur].list()}});
const A={
  flt(el){ui[el.dataset.n]=el.dataset.v;render()},
  cyc(el){const x=S.check.find(c=>c.id===el.dataset.id);x.st=(x.st+1)%3;save('check');V[cur].list?V[cur].list():render()},
  del(el){const m=el.dataset.m;if(m==='rd'){S.rundown[ui.ev].rows=S.rundown[ui.ev].rows.filter(r=>r.id!==el.dataset.id);save('rundown')}else{S[m]=S[m].filter(r=>r.id!==el.dataset.id);save(m)}toast('Removed');V[cur].list()},
  add(el){const m=el.dataset.m;const d={people:{side:ui.side==='Bride'?'Bride':'Groom',role:'',name:'',phone:''},vendors:{cat:'',name:'',phone:'',price:0,paid:0,st:'Looking',note:''},hotel:{who:'',name:'',hotel:'',room:'',cin:'',cout:'',brk:''},trans:{who:'',name:'',pax:'',car:'',dest:'',dep:'',arr:''},meals:{when:'',group:'',qty:0},crew:{phase:ui.crew==='All'?'':ui.crew,desk:'',name:'',phone:''}}[m];
    S[m].push({id:uid(),...d});save(m);ui.q='';V[cur].list();const rows=$$('.row:not(.head)');const last=rows[rows.length-1];last&&last.scrollIntoView({block:'center'});last&&last.querySelector('input,select')&&last.querySelector('input,select').focus()},
  addtask(el){const t=prompt2('New task in '+el.dataset.sec,t=>{if(!t)return;S.check.push({id:uid(),sec:el.dataset.sec,t,when:'',st:0});save('check');V.tasks.list()})},
  addguest(){S.guests.unshift({id:uid(),name:'',phone:'',side:'Groom',pax:1,tag:'',table:'',inv:'Not sent',rsvp:'Pending'});save('guests');ui.guestTab='List';ui.q='';render();const f=$('.row:not(.head) input');f&&f.focus()},
  addrd(){S.rundown[ui.ev].rows.push({id:uid(),dur:15,title:'',pic:''});save('rundown');V.rundown.list();const ins=$$('.row input[data-f="title"]');ins[ins.length-1].focus()},
  mv(el){const rows=S.rundown[ui.ev].rows,i=rows.findIndex(r=>r.id===el.dataset.id),j=i+ +el.dataset.d;if(j<0||j>=rows.length)return;[rows[i],rows[j]]=[rows[j],rows[i]];save('rundown');V.rundown.list()},
  payfull(el){const v=S.vendors.find(x=>x.id===el.dataset.id);v.paid=v.price;if(v.st!=='Paid off')v.st='Paid off';save('vendors');V.money.list();toast('Marked as paid')},
  addpack(){prompt2('New item for '+ui.packWho,t=>{if(!t)return;S.packing.push({id:uid(),who:ui.packWho,phase:'Global',t,done:false});save('packing');V.packing.list()})},
  autoseat(){const cap=+ls.get('vowly.cap')||10;const un=S.guests.filter(g=>!g.table).sort((a,b)=>(a.side+a.tag).localeCompare(b.side+b.tag));
    const used={};S.guests.forEach(g=>{if(g.table)used[g.table]=(used[g.table]||0)+(+g.pax||1)});
    let n=1;const nextT=()=>{while((used[n]||0)>=cap)n++;return n};
    un.forEach(g=>{const p=+g.pax||1;let t=nextT();if((used[t]||0)+p>cap&&(used[t]||0)>0){n++;t=nextT()}g.table=String(t);used[t]=(used[t]||0)+p});
    save('guests');V.guests.list();toast('Seated '+un.length+' guests')},
  paste(){modal(`<h3>Paste guest list</h3><p class="mut" style="margin:0 0 8px">One guest per line. Optional columns, separated by comma or tab: name, phone, people, side (Groom or Bride).</p><textarea id="pt" placeholder="Mr. Budi, 0812…, 2, Groom&#10;Ibu Sari, , 1, Bride"></textarea><div class="tools" style="margin-top:10px"><button class="btn lime" data-act="dopaste">Add guests</button><button class="btn" data-act="close">Cancel</button></div>`)},
  dopaste(){const lines=$('#pt').value.split(/\n/).map(l=>l.trim()).filter(Boolean);lines.forEach(l=>{const c=l.split(/[\t,;]/).map(s=>s.trim());const side=/^b/i.test(c[3]||'')?'Bride':'Groom';S.guests.push({id:uid(),name:c[0],phone:c[1]||'',pax:parseInt(c[2])||1,side,tag:'',table:'',inv:'Not sent',rsvp:'Pending'})});save('guests');closeModal();render();toast(lines.length+' guests added')},
  close(){closeModal()},
  theme(){const r=document.documentElement;const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark'},
  backup(){modal(`<h3>Backup &amp; restore</h3><p class="mut" style="margin:0 0 8px">Your plan is saved on this device and, when you are signed in, in the cloud so your partner and team see the same data. Copy this text to keep a backup, or paste a backup here to restore it.</p><textarea id="bk">${esc(JSON.stringify(S))}</textarea><div class="tools" style="margin-top:10px"><button class="btn" data-act="bkcopy">Copy</button><button class="btn" data-act="bksave">Save file</button><button class="btn lime" data-act="bkrestore">Restore from text</button><button class="btn" data-act="bkreset">${resetArm?'Tap again to wipe':'Reset to blank template'}</button><button class="btn ghost" data-act="close">Close</button></div>`)},
  bkcopy(){const t=$('#bk');navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),()=>{t.select();toast('Press copy on your keyboard')})},
  async bksave(){const d=JSON.stringify(S,null,1);try{const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:'vowly-backup.json',data:d});return}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));a.download='vowly-backup.json';a.click()},
  bkrestore(){try{const n=JSON.parse($('#bk').value);KEYS.forEach(k=>{if(n[k]==null)throw new Error('missing '+k)});S=n;KEYS.forEach(save);closeModal();render();toast('Restored')}catch(e){toast('That backup text is not valid')}},
  bkreset(){if(!resetArm){resetArm=true;A.backup();return}resetArm=false;S=freshState();KEYS.forEach(save);closeModal();render();toast('Blank template loaded')}
};
let resetArm=false;
function modal(h){closeModal();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="card modal" role="dialog" aria-modal="true">${h}</div>`;o.addEventListener('click',e=>{if(e.target===o)closeModal()});$('#layer').appendChild(o);const f=o.querySelector('textarea,input');f&&f.focus()}
function closeModal(){const o=$('#ov');if(o)o.remove();resetArm=false}
function prompt2(label,cb){modal(`<h3>${esc(label)}</h3><input class="fld" id="pi" style="border-color:var(--line);background:var(--soft)" placeholder="Type here"><div class="tools" style="margin-top:10px"><button class="btn lime" id="pok">Add</button><button class="btn" data-act="close">Cancel</button></div>`);const go=()=>{const v=$('#pi').value.trim();closeModal();cb(v)};$('#pok').onclick=go;$('#pi').addEventListener('keydown',e=>{if(e.key==='Enter')go()})}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&A[el.dataset.act]){e.preventDefault();A[el.dataset.act](el)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

render();initCloud();
})();
</script>
