<title>Vowly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: slim rail + content on desktop, bottom tab bar on phones. Calm, compact, professional: neutral surfaces, one indigo accent, hairline borders. */
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#151A23; --mut:#667085; --line:#DFE3EA; --soft:#F1F3F7;
  --acc:#2B4C9B; --acc-soft:#E6ECFA; --on-acc:#FFFFFF;
  --ok:#17794F; --ok-soft:#E2F4EB; --warn:#9A6200; --warn-soft:#FBF0D9; --bad:#B42318; --bad-soft:#FDE8E6;
  --vio:var(--acc); --shadow:rgba(16,24,40,.07);
  --f-d:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-b:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-m:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1117; --card:#161B24; --ink:#E9ECF2; --mut:#98A1B3; --line:#262D3A; --soft:#1C222D;
  --acc:#8FA9F5; --acc-soft:#1F2A47; --on-acc:#0E1117;
  --ok:#53D39A; --ok-soft:#14301F; --warn:#F0B64D; --warn-soft:#33270F; --bad:#FF8A80; --bad-soft:#3A1816; --shadow:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1117; --card:#161B24; --ink:#E9ECF2; --mut:#98A1B3; --line:#262D3A; --soft:#1C222D;
  --acc:#8FA9F5; --acc-soft:#1F2A47; --on-acc:#0E1117;
  --ok:#53D39A; --ok-soft:#14301F; --warn:#F0B64D; --warn-soft:#33270F; --bad:#FF8A80; --bad-soft:#3A1816; --shadow:rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 13.5px/1.5 var(--f-b);font-variant-numeric:tabular-nums;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:20px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--card)}
.logo{font:700 17px/1 var(--f-d);letter-spacing:-.01em;padding:4px 10px 18px}
.logo i{font-style:normal;color:var(--acc)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--mut);font-weight:500}
.nav a svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{color:var(--ink);background:var(--soft)}
.nav a[aria-current=page]{background:var(--acc-soft);color:var(--acc);font-weight:600}
.rail .sp{flex:1}
.sync{font:500 11.5px var(--f-m);color:var(--mut);padding:6px 10px;display:flex;gap:7px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--ok)} .dot.busy{background:var(--warn)}
main{min-width:0;padding:24px max(20px,env(safe-area-inset-right,0px)) 44px 28px;max-width:1180px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font:700 clamp(22px,3.4vw,28px)/1.15 var(--f-d);letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 em{font-style:normal}
.sub{color:var(--mut);margin:4px 0 0;max-width:62ch}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;box-shadow:0 1px 2px var(--shadow);white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn.pri,.btn.lime{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.pri:hover,.btn.lime:hover{filter:brightness(1.08);background:var(--acc)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent;color:var(--mut)}
.btn.ghost:hover{color:var(--ink);background:var(--soft)}
.btn:disabled{opacity:.35;cursor:default}
.ico{width:30px;height:30px;padding:0;justify-content:center}
.ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pills{display:flex;gap:4px;flex-wrap:wrap;background:var(--soft);padding:3px;border-radius:9px;border:1px solid var(--line)}
.pill{border:0;background:transparent;border-radius:6px;padding:3px 11px;font-weight:600;font-size:12px;color:var(--mut)}
.pill:hover{color:var(--ink)}
.pill[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;background:var(--soft);padding:3px;border-radius:9px;border:1px solid var(--line);width:fit-content;max-width:100%}
.tabs .pill{padding:5px 14px;font-size:12.5px}
.search{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;min-width:0;width:200px}
.fld{width:100%;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;color:var(--ink)}
.fld:hover{background:var(--soft)} .fld:focus{background:var(--card);border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
select.fld{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 8px) 55%;background-size:4px 4px;background-repeat:no-repeat;padding-right:20px}
input.num{text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px var(--shadow);min-width:0}
.card h3{font:600 14px var(--f-d);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.mono{font-family:var(--f-m)} .mut{color:var(--mut)}
.chip{display:inline-flex;align-items:center;font:600 11px var(--f-m);border-radius:6px;padding:0 7px;height:20px;white-space:nowrap;background:var(--soft);color:var(--mut)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px;margin-bottom:12px}
.names{padding:22px;overflow:hidden;position:relative}
.names .big{font:700 clamp(30px,5.5vw,52px)/1.05 var(--f-d);letter-spacing:-.03em;overflow-wrap:anywhere;margin-top:4px}
.names .big b{color:var(--acc);font-weight:600}
.names p{margin:8px 0 0;color:var(--mut)}
.stamp{position:absolute;right:14px;top:14px;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:2px 8px;font:600 11px var(--f-m)}
.count{padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.count .n{font:700 clamp(54px,8vw,76px)/.9 var(--f-d);letter-spacing:-.04em}
.count .l{font-weight:600;opacity:.9}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.stat{display:block;text-decoration:none;color:var(--ink);padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 1px 2px var(--shadow)}
a.stat:hover{border-color:var(--acc)}
.stat .k{font:600 11px var(--f-m);text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.stat .v{font:700 26px/1.15 var(--f-d);letter-spacing:-.02em;margin-top:2px}
.stat .s{font-size:12px;color:var(--mut);margin-top:2px}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.li:first-of-type{border-top:0}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.empty{padding:26px;text-align:center;color:var(--mut)}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;box-shadow:0 1px 2px var(--shadow)}
.row{display:grid;gap:4px;align-items:center;padding:3px 8px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{font:600 11px var(--f-m);text-transform:uppercase;letter-spacing:.05em;color:var(--mut);background:var(--soft);padding:8px}
.row .x{opacity:.3;border:0;background:none;border-radius:6px;width:28px;height:28px;color:var(--mut)}
.row:hover .x,.row .x:focus-visible{opacity:1}
.row .x:hover{background:var(--bad-soft);color:var(--bad)}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sum .s{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:100px;box-shadow:0 1px 2px var(--shadow)}
.sum .s b{display:block;font:700 19px/1.2 var(--f-d);letter-spacing:-.01em} .sum .s span{font:600 10.5px var(--f-m);color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.bar2{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--acc)}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 8px}
.sechead h2{font:600 14px var(--f-d);margin:0}
.stbtn{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--mut);background:transparent;flex:none;padding:0;display:grid;place-items:center;font-size:11px;font-weight:700;line-height:1;color:var(--on-acc)}
.stbtn[data-s="1"]{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)} .stbtn[data-s="2"]{border-color:var(--ok);background:var(--ok);color:#fff}
.done .fld.tt{text-decoration:line-through;color:var(--mut)}
.rt{font:600 14px var(--f-m);white-space:nowrap}
.tbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tcard{padding:12px}
.tcard .hd{display:flex;justify-content:space-between;align-items:center;font:600 14px var(--f-d);margin-bottom:6px}
.tcard .g{font-size:12.5px;display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--line);padding:4px 0}
.sec2{margin-top:12px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.form label{display:block;font:600 11px var(--f-m);text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.form .fld{border-color:var(--line);background:var(--card);margin-top:4px;font:400 13.5px var(--f-b);color:var(--ink);text-transform:none;letter-spacing:0;padding:7px 9px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.ov{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:40;display:grid;place-items:center;padding:16px}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px}
.modal textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:8px;font:12px ui-monospace,Menlo,monospace}
.masonry{columns:4 200px;column-gap:12px}
.tile{break-inside:avoid;margin-bottom:12px;position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px var(--shadow)}
.tile img{display:block;width:100%;height:auto;cursor:zoom-in}
.tile .fld{border-radius:0;border-width:0;border-top:1px solid var(--line);font-size:12.5px}
.tile.note .fld{border:0;background:transparent;resize:vertical;color:#151A23;padding:12px 34px 12px 12px;font-size:13.5px;line-height:1.45;min-height:90px}
.tile.note .fld:focus{box-shadow:none;background:rgba(255,255,255,.4)}
.tile .tx{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:7px;border:0;background:rgba(21,26,35,.65);color:#fff;display:grid;place-items:center;opacity:0}
.tile .tx svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.tile:hover .tx,.tile .tx:focus-visible{opacity:1}
@media (hover:none){.tile .tx{opacity:.85}}
.tile .tone{position:absolute;bottom:8px;right:8px;width:18px;height:18px;border-radius:50%;border:2px solid rgba(21,26,35,.35);background:rgba(255,255,255,.55)}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.18);padding:0;display:inline-grid;place-items:center;position:relative;overflow:hidden}
.sw.add{background:var(--soft);color:var(--mut);font-weight:700;cursor:pointer}
.sw.add input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;z-index:30;flex-direction:row;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);align-items:center}
  .logo,.rail .sp,.sync{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;width:100%;scrollbar-width:none}
  .nav a{flex-direction:column;gap:2px;font-size:10.5px;padding:5px 9px;min-width:58px;text-align:center;border-radius:10px}
  main{padding:16px 16px calc(90px + env(safe-area-inset-bottom,0px))}
  .hero{grid-template-columns:minmax(0,1fr)} .count{flex-direction:row;align-items:center}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
  .search{width:100%;flex:1}
  .row:not(.head){grid-template-columns:repeat(2,minmax(0,1fr))!important;padding:8px;gap:4px 8px}
  .row.head{display:none}
  .row .c::before{content:attr(data-l);display:block;font:600 9.5px var(--f-m);text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding-left:7px}
  .row .c.w2{grid-column:span 2}
  .row .x{position:absolute;right:6px;top:6px}
  .row{position:relative}
  .row .c:first-child{padding-right:30px}
}
</style>

<div class="app" id="app">
  <aside class="rail">
    <div class="logo">Vowly<i>.</i></div>

</div>
<div id="layer"></div>

<script>
(()=>{

const SEED=JSON.parse(document.getElementById('seed').textContent);
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- icons ---------- */
const IC={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',event:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',people:'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 11a2.5 2.5 0 1 0 0-5M18 14c2 .6 3 2.4 3 6',tasks:'M4 12l5 5L20 6',vendors:'M4 9l1-5h14l1 5M4 9v11h16V9M4 9h16M10 20v-6h4v6',money:'M12 3v18M16 7c-1-1.5-2.5-2-4-2-2.5 0-4 1.3-4 3s1.5 2.5 4 3 4 1.2 4 3-1.5 3-4 3c-1.5 0-3.2-.6-4.2-2',guests:'M3 6h18v12H3zM3 7l9 7 9-7',rundown:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2',stay:'M3 18V7M3 14h18v4M21 14v-3a3 3 0 0 0-3-3h-7v6',crew:'M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z',packing:'M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2',mood:'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9.5a.6.6 0 1 0 0 .01',sun:'M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5',cloud:'M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6 1A3.5 3.5 0 0 1 17 18z',plus:'M12 5v14M5 12h14',x:'M6 6l12 12M18 6L6 18',up:'M12 19V5M6 11l6-6 6 6',down:'M12 5v14M6 13l6 6 6-6'};

function freshState(){
  const S={};

  SEED.fam.BrideParty.forEach(r=>S.people.push({id:uid(),side:'Bride',role:r,name:'',phone:''}));
  S.check=[];SEED.checklist.forEach(s=>s.items.forEach(([t,w])=>S.check.push({id:uid(),sec:s.name,t,when:w,st:0})));
  S.vendors=SEED.vendors.map(c=>({id:uid(),cat:c,name:'',phone:'',price:0,paid:0,st:'Looking',note:''}));
  S.guests=[];
  const R=(t,d,p)=>({id:uid(),dur:d,title:t,pic:p||''});
  S.rundown={
    prep:{start:'04:30',rows:[R('Morning call & breakfast',20),R('Make-up: groom & family',90),R('Make-up: bride & family',120),R('Dress up & detail photos',45),R('Briefing & standby',20)]},
    morn:{start:'07:30',rows:[R('Team arrival & setup',30),R("Groom's party to bride's home",40),R('Gate games & welcome',30),R('Tea ceremony / tradition',45),R('Family photos',30),R('Depart to Holy Matrimony',30)]},
    holy:{start:'10:00',rows:[R('Registration & seating',30),R('Procession',15),R('Holy Matrimony',60),R('Rings, vows & couple photos',25),R('Family & group photos',30)]},
    rec:{start:'17:00',rows:[R('Event regulation briefing',15),R('General rehearsal',45),R('Doors open & registration',45),R('Couple entrance',10),R('Opening & welcome',10),R('Dinner service',45),R('Cake cutting & toast',15),R('Table visits & photos',45),R('Entertainment',30),R('Closing & farewell',15)]}};

/* ---------- persistence: this device + cloud (db) ---------- */
let dbc=null,cloud='local',dirty=new Set(),flight={},timer=null,firstSnap=true;
function setSync(){
  const el=$('#sync');if(!el)return;
  const m={local:['','Saved on this device'],busy:['busy','Saving…'],on:['on','Synced to cloud'],off:['','Cloud unavailable · saved here']}[cloud];
  el.innerHTML=`<span class="dot ${m[0]}"></span><span>${m[1]}</span>`;
  const b=$('#cloudbadge');if(b)b.innerHTML=`<span class="dot ${m[0]}"></span>${m[1]}`;
}
function save(k){
  ls.set('vowly.planner.v1',JSON.stringify(S));
  if(!dbc){return}
  dirty.add(k);cloud='busy';setSync();clearTimeout(timer);timer=setTimeout(flush,700);
}
async function flush(){
  for(const k of [...dirty]){
    if(flight[k])continue;
    dirty.delete(k);flight[k]=true;
    try{await dbc.doc('planner/'+k).set({json:JSON.stringify(S[k])});}catch(e){cloud='off'}
    flight[k]=false;
    if(dirty.has(k))flush();
  }
  if(!dirty.size&&!Object.values(flight).some(Boolean)&&cloud!=='off'){cloud='on'}
  setSync();
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    dbc=await window.claude.use('db');
    if(!dbc){return}
    cloud='busy';setSync();
    const to=setTimeout(()=>{cloud='off';setSync()},10000);
    dbc.collection('planner').onSnapshot(snap=>{
      clearTimeout(to);
      let changed=false;const seen=new Set();
      snap.docs.forEach(d=>{
        if(!KEYS.includes(d.id))return;seen.add(d.id);
        const j=(d.data()||{}).json;if(typeof j!=='string')return;
        if(dirty.has(d.id)||flight[d.id])return;
        if(j!==JSON.stringify(S[d.id])){try{S[d.id]=JSON.parse(j);changed=true}catch(e){}}
      });
      if(!snap.metadata.fromCache&&firstSnap){firstSnap=false;KEYS.forEach(k=>{if(!seen.has(k))dirty.add(k)});if(dirty.size)flush()}
      if(!snap.metadata.fromCache&&!dirty.size&&!Object.values(flight).some(Boolean)){cloud='on'}
      ls.set('vowly.planner.v1',JSON.stringify(S));setSync();
      if(changed)softRender();
    },e=>{cloud='off';setSync()});
  }catch(e){cloud='off';setSync()}
}

function dueDate(when){
  const w=toDate(S.info.date);if(!w||!when)return null;

const TONES=['#E6ECFA','#FBF0D9','#E2F4EB','#FDE8E6','#EFE7F8','#ECEFF3'];

const getAssets=()=>assetsP||(assetsP=(async()=>{try{return window.claude&&window.claude.use?await window.claude.use('assets'):null}catch(e){return null}})());
const mimg=it=>it.url||(it.aid?'/_blob/'+it.aid:it.src||'');
function shrink(file,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',q)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('read'))};im.src=u})}
const blobToDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const board=()=>S.mood.boards.find(b=>b.id===S.mood.cur)||S.mood.boards[0];
async function addImages(files){
  const b=board();const list=[...files].filter(f=>/^image\//.test(f.type)).slice(0,12);if(!list.length){toast('Choose image files');return}
  const assets=await getAssets();let n=0;toast('Adding '+list.length+(list.length>1?' images…':' image…'));
  for(const f of list){try{
    if(assets){const r=await assets.upload(await shrink(f,1600,.82));b.items.push({id:uid(),type:'img',aid:r.id,url:r.url,cap:''})}
    else{b.items.push({id:uid(),type:'img',src:await blobToDataURL(await shrink(f,420,.7)),cap:''})}
    n++}catch(e){toast('Could not add '+(f.name||'one image'))}}
  save('mood');V.mood.list();if(n)toast(n+(n>1?' images':' image')+' added');
}

  flt(el){ui[el.dataset.n]=el.dataset.v;render()},
  cyc(el){const x=S.check.find(c=>c.id===el.dataset.id);x.st=(x.st+1)%3;save('check');V[cur].list?V[cur].list():render()},
  del(el){const m=el.dataset.m;if(m==='rd'){S.rundown[ui.ev].rows=S.rundown[ui.ev].rows.filter(r=>r.id!==el.dataset.id);save('rundown')}else{S[m]=S[m].filter(r=>r.id!==el.dataset.id);save(m)}toast('Removed');V[cur].list()},
  add(el){const m=el.dataset.m;const d={people:{side:ui.side==='Bride'?'Bride':'Groom',role:'',name:'',phone:''},vendors:{cat:'',name:'',phone:'',price:0,paid:0,st:'Looking',note:''},hotel:{who:'',name:'',hotel:'',room:'',cin:'',cout:'',brk:''},trans:{who:'',name:'',pax:'',car:'',dest:'',dep:'',arr:''},meals:{when:'',group:'',qty:0},crew:{phase:ui.crew==='All'?'':ui.crew,desk:'',name:'',phone:''}}[m];
    S[m].push({id:uid(),...d});save(m);ui.q='';V[cur].list();const rows=$$('.row:not(.head)');const last=rows[rows.length-1];last&&last.scrollIntoView({block:'center'});last&&last.querySelector('input,select')&&last.querySelector('input,select').focus()},
  addtask(el){const t=prompt2('New task in '+el.dataset.sec,t=>{if(!t)return;S.check.push({id:uid(),sec:el.dataset.sec,t,when:'',st:0});save('check');V.tasks.list()})},
  addguest(){S.guests.unshift({id:uid(),name:'',phone:'',side:'Groom',pax:1,tag:'',table:'',inv:'Not sent',rsvp:'Pending'});save('guests');ui.guestTab='List';ui.q='';render();const f=$('.row:not(.head) input');f&&f.focus()},
  addrd(){S.rundown[ui.ev].rows.push({id:uid(),dur:15,title:'',pic:''});save('rundown');V.rundown.list();const ins=$$('.row input[data-f="title"]');ins[ins.length-1].focus()},
  mv(el){const rows=S.rundown[ui.ev].rows,i=rows.findIndex(r=>r.id===el.dataset.id),j=i+ +el.dataset.d;if(j<0||j>=rows.length)return;[rows[i],rows[j]]=[rows[j],rows[i]];save('rundown');V.rundown.list()},
  payfull(el){const v=S.vendors.find(x=>x.id===el.dataset.id);v.paid=v.price;if(v.st!=='Paid off')v.st='Paid off';save('vendors');V.money.list();toast('Marked as paid')},
  addpack(){prompt2('New item for '+ui.packWho,t=>{if(!t)return;S.packing.push({id:uid(),who:ui.packWho,phase:'Global',t,done:false});save('packing');V.packing.list()})},
  autoseat(){const cap=+ls.get('vowly.cap')||10;const un=S.guests.filter(g=>!g.table).sort((a,b)=>(a.side+a.tag).localeCompare(b.side+b.tag));
    const used={};S.guests.forEach(g=>{if(g.table)used[g.table]=(used[g.table]||0)+(+g.pax||1)});
    let n=1;const nextT=()=>{while((used[n]||0)>=cap)n++;return n};
    un.forEach(g=>{const p=+g.pax||1;let t=nextT();if((used[t]||0)+p>cap&&(used[t]||0)>0){n++;t=nextT()}g.table=String(t);used[t]=(used[t]||0)+p});
    save('guests');V.guests.list();toast('Seated '+un.length+' guests')},
  paste(){modal(`<h3>Paste guest list</h3><p class="mut" style="margin:0 0 8px">One guest per line. Optional columns, separated by comma or tab: name, phone, people, side (Groom or Bride).</p><textarea id="pt" placeholder="Mr. Budi, 0812…, 2, Groom&#10;Ibu Sari, , 1, Bride"></textarea><div class="tools" style="margin-top:10px"><button class="btn lime" data-act="dopaste">Add guests</button><button class="btn" data-act="close">Cancel</button></div>`)},
  dopaste(){const lines=$('#pt').value.split(/\n/).map(l=>l.trim()).filter(Boolean);lines.forEach(l=>{const c=l.split(/[\t,;]/).map(s=>s.trim());const side=/^b/i.test(c[3]||'')?'Bride':'Groom';S.guests.push({id:uid(),name:c[0],phone:c[1]||'',pax:parseInt(c[2])||1,side,tag:'',table:'',inv:'Not sent',rsvp:'Pending'})});save('guests');closeModal();render();toast(lines.length+' guests added')},
  close(){closeModal()},
  theme(){const r=document.documentElement;const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark'},
  backup(){modal(`<h3>Backup &amp; restore</h3><p class="mut" style="margin:0 0 8px">Your plan is saved on this device and, when you are signed in, in the cloud so your partner and team see the same data. Copy this text to keep a backup, or paste a backup here to restore it.</p><textarea id="bk">${esc(JSON.stringify(S))}</textarea><div class="tools" style="margin-top:10px"><button class="btn" data-act="bkcopy">Copy</button><button class="btn" data-act="bksave">Save file</button><button class="btn lime" data-act="bkrestore">Restore from text</button><button class="btn" data-act="bkreset">${resetArm?'Tap again to wipe':'Reset to blank template'}</button><button class="btn ghost" data-act="close">Close</button></div>`)},
  bkcopy(){const t=$('#bk');navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),()=>{t.select();toast('Press copy on your keyboard')})},
  async bksave(){const d=JSON.stringify(S,null,1);try{const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:'vowly-backup.json',data:d});return}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'application/json'}));a.download='vowly-backup.json';a.click()},
  bkrestore(){try{const n=JSON.parse($('#bk').value);KEYS.forEach(k=>{if(n[k]==null)throw new Error('missing '+k)});S=n;KEYS.forEach(save);closeModal();render();toast('Restored')}catch(e){toast('That backup text is not valid')}},
  bkreset(){if(!resetArm){resetArm=true;A.backup();return}resetArm=false;S=freshState();KEYS.forEach(save);closeModal();render();toast('Blank template loaded')}
};
let resetArm=false;
function modal(h){closeModal();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="card modal" role="dialog" aria-modal="true">${h}</div>`;o.addEventListener('click',e=>{if(e.target===o)closeModal()});$('#layer').appendChild(o);const f=o.querySelector('textarea,input');f&&f.focus()}
function closeModal(){const o=$('#ov');if(o)o.remove();resetArm=false}
function prompt2(label,cb){modal(`<h3>${esc(label)}</h3><input class="fld" id="pi" style="border-color:var(--line);background:var(--soft)" placeholder="Type here"><div class="tools" style="margin-top:10px"><button class="btn lime" id="pok">Add</button><button class="btn" data-act="close">Cancel</button></div>`);const go=()=>{const v=$('#pi').value.trim();closeModal();cb(v)};$('#pok').onclick=go;$('#pi').addEventListener('keydown',e=>{if(e.key==='Enter')go()})}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&A[el.dataset.act]){e.preventDefault();A[el.dataset.act](el)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

render();initCloud();
})();
</script>
